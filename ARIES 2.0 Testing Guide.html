  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

Barlow Condensed';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"a766b69a-2594-4745-85b5-75c3d5e26127\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"d0d7e6c2-b73e-4f9e-bbaa-72e3975767a5\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 400;\n  font-display: swap;\n  src: url(\"a423a550-a0b3-430f-b0bf-f5add4927843\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"3db59a2d-7f5b-4f2d-912d-a9f32ca17c02\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"08d616bb-6d38-456c-8266-e5a97fe708a5\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Barlow Condensed';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"8de6eceb-1682-4ca0-a365-41eaabf735ad\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f2f2f3;\n  --color-surface: #e9e9ea;\n  --color-text: #1d1f20;\n  --color-accent: #5980a6;\n  --color-accent-2: #728fab;\n  --color-divider: color-mix(in srgb, #1d1f20 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f5f5f8;\n  --color-neutral-200: #e7e7ea;\n  --color-neutral-300: #d4d4d7;\n  --color-neutral-400: #b7b7ba;\n  --color-neutral-500: #98989b;\n  --color-neutral-600: #7a7a7d;\n  --color-neutral-700: #5d5d60;\n  --color-neutral-800: #424244;\n  --color-neutral-900: #2b2b2d;\n\n  --color-accent-100: #eef6ff;\n  --color-accent-200: #d6ebff;\n  --color-accent-300: #b5d9fd;\n  --color-accent-400: #94bce3;\n  --color-accent-500: #749dc4;\n  --color-accent-600: #597ea3;\n  --color-accent-700: #416180;\n  --color-accent-800: #2c455d;\n  --color-accent-900: #1d2d3d;\n\n  --color-accent-2-100: #eef6ff;\n  --color-accent-2-200: #d6ebff;\n  --color-accent-2-300: #bdd8f2;\n  --color-accent-2-400: #9ebbd8;\n  --color-accent-2-500: #7e9cb8;\n  --color-accent-2-600: #627d98;\n  --color-accent-2-700: #486077;\n  --color-accent-2-800: #314457;\n  --color-accent-2-900: #1f2d3a;\n\n  --font-heading: \"Barlow Condensed\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Barlow\", system-ui, sans-serif;\n\n  --space-1: 3.4px;\n  --space-2: 6.8px;\n  --space-3: 10.2px;\n  --space-4: 13.6px;\n  --space-6: 20.4px;\n  --space-8: 27.2px;\n\n  --radius-sm: 2px;\n  --radius-md: 4px;\n  --radius-lg: 7px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2b2b2d 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2b2b2d 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2b2b2d 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.blueprint {\n  position: relative;\n  border: 1px solid var(--color-divider);\n  border-radius: 0;\n}\n/* The overlay image treatments (halftone, duotone) clip their overlay\n   (overflow:hidden); a blueprint wrapper draws its registration marks\n   outside the box, so when both classes share a wrapper the frame must\n   win. */\n.blueprint.halftone, .blueprint.plate, .blueprint.duotone { overflow: visible; }\n.blueprint > .corner {\n  position: absolute; width: 11px; height: 11px;\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.blueprint > .corner::before, .blueprint > .corner::after {\n  content: \"\"; position: absolute; background: currentColor;\n}\n.blueprint > .corner::before { left: 5px; top: 0; width: 1px; height: 100%; }\n.blueprint > .corner::after  { top: 5px; left: 0; width: 100%; height: 1px; }\n.blueprint > .corner.tl { top: -6px; left: -6px; }\n.blueprint > .corner.tr { top: -6px; right: -6px; }\n.blueprint > .corner.bl { bottom: -6px; left: -6px; }\n.blueprint > .corner.br { bottom: -6px; right: -6px; }\n\n.duotone{position:relative;overflow:hidden}\n.duotone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background:var(--color-accent);mix-blend-mode:color}\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n/* — blueprint frame: components are wireframe objects (see .blueprint\n     and .corner above) — square, transparent, hairline-bordered — */\n.card, .btn, .input, .tag, .seg, .dialog { border-radius: 0; }\n.card, .dialog { background: transparent; border: 1px     <div class=\"blueprint\" style=\"padding:14px 16px\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div style=\"font-family:var(--font-heading);font-weight:600;font-size:38px;line-height:1;color:var(--color-accent-700)\">{{ issueCount }}<\u002Fdiv><div class=\"text-muted\" style=\"font-size:12px;margin-top:4px\">△ Pass with issues<\u002Fdiv><\u002Fdiv>\n        <div class=\"blueprint\" style=\"padding:14px 16px\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div style=\"font-family:var(--font-heading);font-weight:600;font-size:38px;line-height:1;color:var(--color-accent-700)\">{{ failCount }}<\u002Fdiv><div class=\"text-muted\" style=\"font-size:12px;margin-top:4px\">✕ Fail<\u002Fdiv><\u002Fdiv>\n        <div class=\"blueprint\" style=\"padding:14px 16px\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><div style=\"font-family:var(--font-heading);font-weight:600;font-size:38px;line-height:1;color:var(--color-neutral-500)\">{{ pendingCount }}<\u002Fdiv><div class=\"text-muted\" style=\"font-size:12px;margin-top:4px\">— Not recorded<\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"display:grid;grid-template-columns:1.35fr 1fr;gap:24px;align-items:start\">\n        <div class=\"blueprint\" style=\"padding:16px 20px\">\n          <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n          <div style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);font-weight:700;margin-bottom:8px\">Results summary<\u002Fdiv>\n          <sc-for list=\"{{ summaryRows }}\" as=\"r\" hint-placeholder-count=\"17\">\n            <div style=\"display:grid;grid-template-columns:52px 72px 1fr auto;gap:10px;align-items:baseline;padding:6px 0;border-top:1px solid color-mix(in srgb, var(--color-text) 8%, transparent);font-size:13px\">\n              <span style=\"font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px\">{{ r.n }}<\u002Fspan>\n              <span class=\"text-muted\" style=\"font-size:12px\">{{ r.m }}<\u002Fspan>\n              <span>{{ r.t }}<\u002Fspan>\n              <span style=\"font-weight:500;white-space:nowrap\">{{ r.vLabel }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:18px\">\n          <div class=\"field\"><label id=\"overall-label\">Overall result<\u002Flabel>\n            <div class=\"seg\" role=\"radiogroup\" aria-labelledby=\"overall-label\">\n              <label class=\"seg-opt\"><input type=\"radio\" name=\"overall\" value=\"pass\" sc-camel-on-change=\"{{ onOverall }}\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>Pass<\u002Flabel>\n              <label class=\"seg-opt\"><input type=\"radio\" name=\"overall\" value=\"issues\" sc-camel-on-change=\"{{ onOverall }}\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 20h16a2 2 0 0 0 1.73-2Z\"><\u002Fpath><path d=\"M12 9v4\"><\u002Fpath><path d=\"M12 17h.01\"><\u002Fpath><\u002Fsvg>Pass with issues<\u002Flabel>\n              <label class=\"seg-opt\"><input type=\"radio\" name=\"overall\" value=\"fail\" sc-camel-on-change=\"{{ onOverall }}\"><svg width=\"12\" height=\"12\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M18 6 6 18\"><\u002Fpath><path d=\"m6 6 12 12\"><\u002Fpath><\u002Fsvg>Fail<\u002Flabel>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div class=\"field\"><label for=\"gen-comments\">General comments<\u002Flabel>\n            <textarea class=\"input\" id=\"gen-comments\" sc-camel-on-change=\"{{ onComments }}\" placeholder=\"Overall impressions, anything not covered by a test case…\" style=\"min-height:110px\"><\u002Ftextarea>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:8px\">\n            <button type=\"button\" class=\"btn btn-primary blueprint\" sc-camel-on-click=\"{{ downloadReport }}\" style=\"justify-content:center\"><i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z\"><\u002Fpath><path d=\"M14 2v4a2 2 0 0 0 2 2h4\"><\u002Fpath><path d=\"M12 18v-6\"><\u002Fpath><path d=\"m9 15 3 3 3-3\"><\u002Fpath><\u002Fsvg>Download report file<\u002Fbutton>\n            <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ emailReport }}\" style=\"justify-content:center\"><svg width=\"14\" height=\"14\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"20\" height=\"16\" x=\"2\" y=\"4\" rx=\"2\"><\u002Frect><path d=\"m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7\"><\u002Fpath><\u002Fsvg>Email report to rshook@academica.org<\u002Fbutton>\n            <div class=\"text-muted\" style=\"font-size:12px;text-align:center\">The email opens in your mail app with the report pre-filled — attach the downloaded file too if anything looks trimmed.<\u002Fdiv>\n            <button type=\"button\" class=\"btn btn-ghost\" sc-camel-on-click=\"{{ resetAll }}\" style=\"justify-self:center;font-size:12.5px\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8\"><\u002Fpath><path d=\"M3 3v5h5\"><\u002Fpath><\u002Fsvg>{{ resetLabel }}<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"card blueprint\" style=\"padding:18px 20px;margin-top:24px\">\n        <i class=\"corner tl\"><\u002Fi><i class=\"corner tr\"><\u002Fi><i class=\"corner bl\"><\u002Fi><i class=\"corner br\"><\u002Fi>\n        <div style=\"display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap\">\n          <div style=\"flex:1;min-width:260px\">\n            <div style=\"font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--color-accent-700);font-weight:700;margin-bottom:6px\">Found a bug?<\u002Fdiv>\n            <p style=\"font-size:13.5px;margin:0\">Paste this template into the notes of the failing test case (or your email) and fill it in — it gives engineering everything they need to reproduce the problem.<\u002Fp>\n            <button type=\"button\" class=\"btn btn-secondary\" sc-camel-on-click=\"{{ copyBugTemplate }}\" style=\"margin-top:12px\"><svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"8\" height=\"4\" x=\"8\" y=\"2\" rx=\"1\" ry=\"1\"><\u002Frect><path d=\"M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2\"><\u002Fpath><\u002Fsvg>Copy the template<\u002Fbutton>\n          <\u002Fdiv>\n          <pre style=\"flex:1;min-width:280px;margin:0;padding:12px 14px;border:1px dashed color-mix(in srgb, var(--color-accent) 50%, transparent);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;line-height:1.6;white-space:pre-wrap\">Title:\nModule: (School / Network / District / Campus / Login)\nURL:\nSteps to reproduce: 1. 2. 3.\nExpected result:\nActual result:\nScreenshot / short video:\nBrowser + OS:\nSeverity: Blocker / Major / Minor / Cosmetic<\u002Fpre>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <footer style=\"margin-top:64px;border-top:1px solid var(--color-divider);padding-top:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap\">\n      <img src=\"2bf93676-1cf9-41cf-b544-c9b1c86b7f11\" alt=\"ARIES 2.0\" style=\"height:20px;width:auto;opacity:0.75\">\n      <span class=\"text-muted\" style=\"font-size:12px\">Testing guide v1.0 · Staging — School Directory focus · Your progress is saved in this browser<\u002Fspan>\n    <\u002Ffooter>\n  <\u002Fmain>\n\n  <sc-if value=\"{{ toastOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed;left:50%;bottom:26px;transform:translate(-50%,0);z-index:99;background:var(--color-neutral-900);color:var(--color-neutral-100);padding:9px 18px;font-size:13px;animation:toast-in 0.2s ease\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n\n  \n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{\n  &quot;reportEmail&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;rshook@academica.org&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Report&quot;},\n  &quot;reportFormat&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;default&quot;: &quot;markdown&quot;, &quot;options&quot;: [&quot;markdown&quot;, &quot;plain text&quot;], &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Report&quot;},\n  &quot;requireName&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Report&quot;},\n  &quot;guideVersion&quot;: {&quot;editor&quot;: &quot;text&quot;, &quot;default&quot;: &quot;1.0&quot;, &quot;tsType&quot;: &quot;string&quot;, &quot;section&quot;: &quot;Report&quot;}\n}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.KEY = 'aries2-testing-guide-v1';\n    this.TCS = [\n      {id:'tc01',n:'TC-01',t:'Log in with email & password',m:'Login'},\n      {id:'tc02',n:'TC-02',t:'Log out from the left sidebar',m:'Logout'},\n      {id:'tc03',n:'TC-03',t:'Network list — load, search & sort',m:'Networks'},\n      {id:'tc04',n:'TC-04',t:'Create a network',m:'Networks'},\n      {id:'tc05',n:'TC-05',t:'Edit & delete a network',m:'Networks'},\n      {id:'tc06',n:'TC-06',t:'District list — load, search & sort',m:'Districts'},\n      {id:'tc07',n:'TC-07',t:'Create a district',m:'Districts'},\n      {id:'tc08',n:'TC-08',t:'Edit & delete a district',m:'Districts'},\n      {id:'tc09',n:'TC-09',t:'Campus list — load, search & status filter',m:'Campuses'},\n      {id:'tc10',n:'TC-10',t:'Create a campus — with status',m:'Campuses'},\n      {id:'tc11',n:'TC-11',t:'Edit & delete a campus',m:'Campuses'},\n      {id:'tc12',n:'TC-12',t:'School list & filters',m:'Schools'},\n      {id:'tc13',n:'TC-13',t:'Create a school — all sections',m:'Schools'},\n      {id:'tc14',n:'TC-14',t:'Edit a school',m:'Schools'},\n      {id:'tc15',n:'TC-15',t:'Delete a school',m:'Schools'},\n      {id:'tc16',n:'TC-16',t:'Validation & negative tests',m:'Validation'},\n      {id:'tc17',n:'TC-17',t:'Browser / UX smoke checks',m:'Smoke'}\n    ];\n    this.BUG_TPL = 'Title:\\nModule: (School / Network / District / Campus / Login)\\nURL:\\nSteps to reproduce:\\n1.\\n2.\\n3.\\nExpected result:\\nActual result:\\nScreenshot / short video:\\nBrowser + OS:\\nSeverity: Blocker / Major / Minor / Cosmetic';\n    this.state = {verdicts:{}, notes:{}, tester:{name:'',email:'',role:''}, overall:'', comments:'', toast:'', toastOn:false, resetArmed:false};\n  }\n  componentDidMount() {\n    let s = null;\n    try { s = JSON.parse(localStorage.getItem(this.KEY) || 'null'); } catch (e) {}\n    if (s && typeof s === 'object') {\n      this.setState({\n        verdicts: s.verdicts || {}, notes: s.notes || {},\n        tester: Object.assign({name:'',email:'',role:''}, s.tester || {}),\n        overall: s.overall || '', comments: s.comments || ''\n      }, () => this.hydrate());\n    }\n    this.syncBar();\n  }\n  componentDidUpdate() { this.syncBar(); }\n  syncBar() {\n    const f = document.getElementById('progress-fill');\n    if (f) f.style.width = Math.round(this.recordedCount() / this.TCS.length * 100) + '%';\n  }\n  recordedCount() { return this.TCS.reduce((a, tc) => a + (this.state.verdicts[tc.id] ? 1 : 0), 0); }\n  hydrate() {\n    const st = this.state;\n    document.querySelectorAll('input[data-k]').forEach(el => { el.value = st.tester[el.dataset.k] || ''; });\n    document.querySelectorAll('textarea[data-tc]').forEach(el => { el.value = st.notes[el.dataset.tc] || ''; });\n    const gc = document.getElementById('gen-comments'); if (gc) gc.value = st.comments || '';\n    Object.keys(st.verdicts).forEach(id => {\n      const el = document.querySelector('input[name=\"v-' + id + '\"][value=\"' + st.verdicts[id] + '\"]');\n      if (el) el.checked = true;\n    });\n    if (st.overall) { const el = document.querySelector('input[name=\"overall\"][value=\"' + st.overall + '\"]'); if (el) el.checked = true; }\n  }\n  persist() {\n    const {verdicts, notes, tester, overall, comments} = this.state;\n    try { localStorage.setItem(this.KEY, JSON.stringify({verdicts, notes, tester, overall, comments})); } catch (e) {}\n  }\n  patch(p) { this.setState(p, () => this.persist()); }\n  flash(msg) {\n    clearTimeout(this._tt);\n    this.setState({toast: msg, toastOn: true});\n    this._tt = setTimeout(() => this.setState({toastOn: false}), 2400);\n  }\n  copyFallback(text) {\n    const t = document.createElement('textarea');\n    t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';\n    document.body.appendChild(t); t.select();\n    try { document.execCommand('copy'); } catch (e) {}\n    document.body.removeChild(t);\n  }\n  copy(text, label) {\n    const done = () => this.flash('Copied ' + label);\n    if (navigator.clipboard && navigator.clipboard.writeText) {\n      navigator.clipboard.writeText(text).then(done).catch(() => { this.copyFallback(text); done(); });\n    } else { this.copyFallback(text); done(); }\n  }\n  requireNameOk() {\n    if (this.props.requireName === false) return true;\n    if ((this.state.tester.name || '').trim()) return true;\n    this.flash('Add your name in section 00 first');\n    const el = document.getElementById('t-name');\n    if (el) {\n      const y = el.getBoundingClientRect().top + window.scrollY - 130;\n      window.scrollTo({top: y, behavior: 'smooth'});\n      setTimeout(() => el.focus(), 500);\n    }\n    return false;\n  }\n  fmtDate() { return new Date().toLocaleDateString(undefined, {year:'numeric', month:'short', day:'numeric'}); }\n  buildReport() {\n    const st = this.state;\n    const L = {pass:'PASS', issues:'PASS WITH ISSUES', fail:'FAIL'};\n    const c = {pass:0, issues:0, fail:0}; let rec = 0;\n    this.TCS.forEach(tc => { const v = st.verdicts[tc.id]; if (v) { c[v]++; rec++; } });\n    const mods = [...new Set(this.TCS.filter(tc => st.verdicts[tc.id]).map(tc => tc.m))];\n    const now = new Date();\n    const lines = [];\n    lines.push('ARIES 2.0 — STAGING TEST REPORT');\n    lines.push('===============================');\n    lines.push('');\n    lines.push('Tester:          ' + ((st.tester.name || '—').trim()) + (st.tester.email ? ' <' + st.tester.email.trim() + '>' : '') + (st.tester.role ? ' — ' + st.tester.role.trim() : ''));\n    lines.push('Date:            ' + now.toLocaleString(undefined, {year:'numeric', month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}));\n    lines.push('Environment:     https://dev.ariescolegia.com (staging)');\n    lines.push('Guide:           ARIES 2.0 Testing Guide v' + (this.props.guideVersion ?? '1.0') + ' — School Directory focus');\n    lines.push('Overall result:  ' + (st.overall ? L[st.overall] : 'Not set'));\n    lines.push('Recorded:        ' + rec + ' of ' + this.TCS.length + ' test cases');\n    lines.push('Totals:          ' + c.pass + ' pass / ' + c.issues + ' pass with issues / ' + c.fail + ' fail / ' + (this.TCS.length - rec) + ' not recorded');\n    lines.push('Modules tested:  ' + (mods.length ? mods.join(', ') : '—'));\n    lines.push('');\n    lines.push('RESULTS');\n    lines.push('-------');\n    this.TCS.forEach(tc => {\n      const v = st.verdicts[tc.id];\n      lines.push('[' + (v ? L[v] : 'NOT RECORDED') + '] ' + tc.n + ' · ' + tc.m + ' · ' + tc.t);\n      const note = (st.notes[tc.id] || '').trim();\n      if (note) note.split('\\n').forEach(nl => lines.push('    ' + nl));\n    });\n    lines.push('');\n    lines.push('GENERAL COMMENTS');\n    lines.push('----------------');\n    lines.push((st.comments || '').trim() || '—');\n    lines.push('');\n    lines.push('Generated by the ARIES 2.0 online testing guide.');\n    return lines.join('\\n');\n  }\n  slug(s) { return (s || 'tester').trim().replace(/[^a-z0-9]+/gi, '-').replace(/^-+|-+$/g, '') || 'tester'; }\n  downloadReport = () => {\n    if (!this.requireNameOk()) return;\n    const txt = this.buildReport();\n    const ext = (this.props.reportFormat ?? 'markdown') === 'plain text' ? 'txt' : 'md';\n    const d = new Date();\n    const iso = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');\n    const a = document.createElement('a');\n    a.href = URL.createObjectURL(new Blob([txt], {type: 'text/plain'}));\n    a.download = 'ARIES-2.0-Test-Report_' + this.slug(this.state.tester.name) + '_' + iso + '.' + ext;\n    document.body.appendChild(a); a.click(); a.remove();\n    setTimeout(() => URL.revokeObjectURL(a.href), 4000);\n    this.flash('Report downloaded');\n  };\n  emailReport = () => {\n    if (!this.requireNameOk()) return;\n    let body = this.buildReport();\n    let trimmed = false;\n    if (body.length > 5500) { body = body.slice(0, 5500) + '\\n…\\n(Trimmed — the downloaded report file has the full details.)'; trimmed = true; }\n    const to = this.props.reportEmail ?? 'rshook@academica.org';\n    const subj = 'ARIES 2.0 staging test report — ' + this.state.tester.name.trim();\n    const a = document.createElement('a');\n    a.href = 'mailto:' + to + '?subject=' + encodeURIComponent(subj) + '&body=' + encodeURIComponent(body);\n    document.body.appendChild(a); a.click(); a.remove();\n    this.flash(trimmed ? 'Opening your mail app — long report, attach the downloaded file too' : 'Opening your mail app');\n  };\n  resetAll = () => {\n    if (!this.state.resetArmed) {\n      this.setState({resetArmed: true});\n      this.flash('This clears every answer — click again to confirm');\n      clearTimeout(this._rt);\n      this._rt = setTimeout(() => this.setState({resetArmed: false}), 3500);\n      return;\n    }\n    clearTimeout(this._rt);\n    try { localStorage.removeItem(this.KEY); } catch (e) {}\n    document.querySelectorAll('input[type=\"radio\"]').forEach(el => { el.checked = false; });\n    document.querySelectorAll('input[data-k], textarea[data-tc]').forEach(el => { el.value = ''; });\n    const gc = document.getElementById('gen-comments'); if (gc) gc.value = '';\n    this.setState({verdicts:{}, notes:{}, tester:{name:'',email:'',role:''}, overall:'', comments:'', resetArmed:false});\n    this.flash('All responses cleared');\n  };\n  renderVals() {\n    const st = this.state;\n    const total = this.TCS.length;\n    const c = {pass:0, issues:0, fail:0}; let rec = 0;\n    this.TCS.forEach(tc => { const v = st.verdicts[tc.id]; if (v) { c[v]++; rec++; } });\n    const G = {pass:'✓ Pass', issues:'△ Pass with issues', fail:'✕ Fail'};\n    const left = total - rec;\n    return {\n      progressText: rec + ' / ' + total,\n      todayDisplay: this.fmtDate(),\n      passCount: c.pass, issueCount: c.issues, failCount: c.fail, pendingCount: left,\n      pendingNote: rec === total ? 'All 17 test cases recorded — thank you. Review the summary, set your overall result, and send it back.' : left + ' test case' + (left === 1 ? '' : 's') + ' not yet recorded — anything left blank appears as “not recorded” in the report.',\n      summaryRows: this.TCS.map(tc => {\n        const v = st.verdicts[tc.id];\n        return {n: tc.n, m: tc.m, t: tc.t, vLabel: v ? G[v] : '—'};\n      }),\n      toast: st.toast, toastOn: st.toastOn,\n      resetLabel: st.resetArmed ? 'Click again to confirm' : 'Clear all responses',\n      onTester: (e) => { const tester = Object.assign({}, this.state.tester); tester[e.target.dataset.k] = e.target.value; this.patch({tester}); },\n      onVerdict: (e) => { const verdicts = Object.assign({}, this.state.verdicts); verdicts[e.target.name.slice(2)] = e.target.value; this.patch({verdicts}); },\n      onNote: (e) => { const notes = Object.assign({}, this.state.notes); notes[e.target.dataset.tc] = e.target.value; this.patch({notes}); },\n      onOverall: (e) => { this.patch({overall: e.target.value}); },\n      onComments: (e) => { this.patch({comments: e.target.value}); },\n      copyText: (e) => { const b = e.currentTarget; this.copy(b.dataset.copy, b.dataset.label || ''); },\n      copyBugTemplate: () => { this.copy(this.BUG_TPL, 'the bug template'); },\n      downloadReport: this.downloadReport,\n      emailReport: this.emailReport,\n      resetAll: this.resetAll\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
